<template>
    <lightning-card title="Refresh Apex Demo LWC" icon-name="custom:custom44">
        <!--{isContactAvailable} : To make sure contacts are available (data is coming) -->

        <!-- lightning-datatable def:
            key-field="Id"  :To make the lightning-datatable unique
            data={contacts.data}  : To get the data from the wire service, that we need to render on the table
            columns={columns}  : To get the columns from the js file, based on this we can give the headings
            onsave={handleSave} : To handle the save operation when we edit the data in the table
            draft-values={draftValues} : To store the values that are being edited in the table, 
            ex: if we edit 4 fields in the column then, it will take care of those 4 fields and store the values in draft-values attribute, so that we can use it in the js file to update the records
        -->
        <!--when you edit something then we have save for that we'll use attribute: onsave -->
        <!--In editing we can edit multiple fields at time for that we'll use attribute: data-values
        this attribute stores the values-->
        <template if:true={contacts.data}>  <!--when the data is available then we want to load Datatable-->
            <div class="slds-m-around_medium">
                <lightning-datatable
                key-field="Id"
                data={contacts.data}
                columns={columns}
                onsave={handleSave}
                draft-values={draftValues}
                ></lightning-datatable>
            </div>
        </template>
    </lightning-card> 
</template>
